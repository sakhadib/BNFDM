name: pubcheck

# Builds the paper and runs ACL pubcheck on it. The submission build uses
# \usepackage[review]{acl} and prints line numbers in the margins, which
# pubcheck reports as violations, so tools/pubcheck.sh derives a
# camera-ready-style copy and checks that instead.

on:
  push:
    paths:
      - 'paper/**'
      - 'tools/pubcheck.sh'
      - '.github/workflows/pubcheck.yml'
  pull_request:
    paths:
      - 'paper/**'
      - 'tools/pubcheck.sh'
  workflow_dispatch:

jobs:
  pubcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install XeLaTeX and the fonts the paper needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-plain-generic \
            texlive-fonts-recommended texlive-fonts-extra texlive-bibtex-extra \
            texlive-lang-other biber lmodern fonts-texgyre
          fc-cache -f >/dev/null 2>&1 || true
          # the paper loads TeX Gyre Termes and TikZ by name; fail loudly here
          # rather than inside the paper build if either is missing
          kpsewhich tikz.sty >/dev/null || { echo "tikz.sty missing"; exit 1; }
          fc-list | grep -qi "tex gyre termes" || echo "note: TeX Gyre Termes not in fontconfig"

      - name: Cache the aclpubcheck venv
        uses: actions/cache@v4
        with:
          path: .pubcheck-venv
          key: pubcheck-venv-${{ runner.os }}-py311-v1

      - name: Run pubcheck
        id: run
        env:
          PUBCHECK_VENV: ${{ github.workspace }}/.pubcheck-venv
          PUBCHECK_WORKDIR: ${{ github.workspace }}/.pubcheck-work
        run: |
          mkdir -p "$PUBCHECK_WORKDIR"
          set -o pipefail
          ./tools/pubcheck.sh --refs 2>&1 | tee "$PUBCHECK_WORKDIR/report.txt"

      - name: Summary
        if: always()
        run: |
          W="${{ github.workspace }}/.pubcheck-work"
          {
            if [ "${{ steps.run.outcome }}" = "success" ]; then
              echo "## pubcheck: all okay"
            else
              echo "## pubcheck: problems found"
            fi
            echo
            echo '```'
            sed -n '/submission-build guards/,$p' "$W/report.txt" 2>/dev/null \
              || echo "no report produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the build log and the pubcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pubcheck-report
          path: |
            .pubcheck-work/report.txt
            .pubcheck-work/build.log
            .pubcheck-work/build/check.pdf
            .pubcheck-work/build/errors-*.json
          if-no-files-found: ignore
